<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Fokrul's Expense Tracker</h1>

        <div class="form-section">
            <form id="expense-form">
                <div class="form-group">
                    <label for="title">Expense Title:</label>
                    <input type="text" id="title" placeholder="e.g., Lunch, Rickshaw fare">
                </div>

                <div class="form-group">
                    <label for="amount">Amount (BDT):</label>
                    <input type="number" id="amount" placeholder="e.g., 250">
                </div>

                <div class="form-group">
                    <label for="category">Category:</label>
                    <select id="category">
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Transport">Transport</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Others">Others</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Expense Date:</label>
                    <input type="date" id="date">
                </div>

                <div class="form-group">
                    <label for="payment">Payment Method:</label>
                    <select id="payment">
                        <option value="">Select Method</option>
                        <option value="Cash">Cash</option>
                        <option value="bKash">bKash</option>
                        <option value="Nagad">Nagad</option>
                        <option value="Card">Card</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" id="add-btn">Add Expense</button>
                    <button type="submit" id="update-btn" style="display: none;">Update Expense</button>
                    <button type="button" id="reset-btn">Reset Form</button>
                </div>
            </form>
        </div>

        <div class="summary-section">
            <h2>Summary</h2>
            <div class="summary-grid">
                <div class="summary-box">Total Expenses: <span id="total-expense">0</span> BDT</div>
                <div class="summary-box">Transactions: <span id="total-transactions">0</span></div>
                <div class="summary-box">Highest Expense: <span id="highest-expense">0</span> BDT</div>
                <div class="summary-box">Lowest Expense: <span id="lowest-expense">0</span> BDT</div>
                <div class="summary-box">Average Expense: <span id="average-expense">0</span> BDT</div>
            </div>
            <button id="clear-all-btn" class="clear-btn">Clear All Expenses</button>
        </div>

        <div class="table-section">
            <h2>Expense List</h2>
            <table>
                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Amount</th>
                        <th>Category</th>
                        <th>Date</th>
                        <th>Payment Method</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expense-table-body">
                    
                </tbody>
            </table>
        </div>
    </div>

    <script src="fokrul.js"></script>
</body>
</html>
